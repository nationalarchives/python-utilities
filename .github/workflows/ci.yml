name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: docker run --rm -v "$(pwd)":/app/ ghcr.io/nationalarchives/tna-python-dev:latest checkformat

  test:
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry (Linux/Mac)
        if: ${{ matrix.os != 'windows-latest' }}
        run: curl -sSL https://install.python-poetry.org | python -
      - name: Install Poetry (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | py -
          setx /M "%path%;C:\Users\runneradmin\AppData\Roaming\Python\Scripts"
      - name: Show Poetry version
        run: poetry --version
      - name: Install dependencies
        run: poetry install --with test
      - name: Run tests
        run: poetry run python -m unittest discover tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install build dependencies
        run: python -m pip install --upgrade pip
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python -
      - name: Install dependencies
        run: poetry install
      - name: Build package
        run: poetry build
