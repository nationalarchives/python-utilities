name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  check_format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: docker run --rm -v "$(pwd)":/app/ ghcr.io/nationalarchives/tna-python-dev:latest checkformat

  test:
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry (Linux/Mac)
        if: ${{ matrix.os != 'windows-latest' }}
        run: curl -sSL https://install.python-poetry.org | python -
      - name: Install Poetry (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | py -
          SETX /?
          SETX /M "%path%;C:\Users\runneradmin\AppData\Roaming\Python\Scripts"
      - name: Show Poetry version
        run: poetry --version
      - name: Install dependencies
        run: poetry install --with test
      - name: Run tests
        run: poetry run python -m unittest discover tests

  deploy:
    runs-on: ubuntu-latest
    needs:
      - check_format
      - test
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python -
      - name: Install dependencies
        run: poetry install
      - name: Build package
        run: poetry build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
